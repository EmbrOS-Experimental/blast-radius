[project]
name = "blast-radius"
version = "0.1.0"
description = "PR risk simulator for predicting impact of code changes"
authors = [
    {name = "Gemini CLI", email = "gemini-cli@google.com"}
]
dependencies = [
    "tree-sitter>=0.20.0",
    "tree-sitter-languages>=1.7.0",
    "gitpython>=3.1.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0"
]
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
blastradius = "blastradius.cli.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build-meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
